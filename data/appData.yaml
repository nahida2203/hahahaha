creation_scenarios:
  - id: tea-launch
    title: 春茶上市推广
    description: 快速生成一套新品上市内容，突出时令、口感和产地。
    eyebrow: 新品上市
    color: '#168c61'
    channels: [douyin, shipinhao, pengyouquan]
    outputTypes: [copy, voiceover]
    assetPolicy: recommended
    assetHint: 有产品图会更有画面感，没有也可以先生成文案
    promptTemplate: 围绕春茶上市，突出当季新采、口感清甜与产地直发，输出真实克制的助农推广内容。
    templateId: tpl-tea-launch
  - id: moments
    title: 朋友圈宣传
    description: 适合日常发圈，快速整理一段亲切可信的产品分享。
    eyebrow: 日常分享
    color: '#3f51d7'
    channels: [pengyouquan]
    outputTypes: [copy]
    assetPolicy: optional
    assetHint: 可不上传图片，先把想表达的卖点说清楚
    promptTemplate: 生成一段适合朋友圈的产品分享文案，用第一人称表达真实体验，避免夸大功效。
  - id: short-video
    title: 短视频口播稿
    description: 从开场钩子到行动号召，生成一条可直接拍摄的口播脚本。
    eyebrow: 短视频
    color: '#e07a32'
    channels: [douyin, shipinhao]
    outputTypes: [voiceover, storyboard]
    assetPolicy: recommended
    assetHint: 上传实拍图后，可自动补充镜头和字幕建议
    promptTemplate: 生成一条30秒以内的短视频口播稿，包含开场钩子、三条卖点和明确的行动号召。
  - id: poster
    title: 产品海报
    description: 把产品图片和核心卖点整理成一张发布用海报。
    eyebrow: 视觉物料
    color: '#b45678'
    channels: [pengyouquan, shipinhao]
    outputTypes: [poster]
    assetPolicy: required
    assetHint: 至少上传1张产品或产地图片
    promptTemplate: 将产品核心卖点整理成一张信息清楚、可信克制的产品海报。
  - id: county-brand
    title: 县域品牌宣传
    description: 适合政府单位和品牌团队，统一输出正式、可信的传播内容。
    eyebrow: 品牌传播
    color: '#7654a5'
    channels: [shipinhao, pengyouquan]
    outputTypes: [article, copy]
    assetPolicy: recommended
    assetHint: 可补充县域、基地和品牌素材，便于内容更准确
    promptTemplate: 围绕县域公用品牌，突出产地、产业和真实人物，生成正式可信的品牌传播内容。

output_types:
  - id: copy
    label: 社媒文案
    description: 朋友圈、视频号和抖音文案
    icon: ChatDotRound
    needsImage: false
  - id: article
    label: 图文长文
    description: 适合公众号或详情页
    icon: Document
    needsImage: false
  - id: voiceover
    label: 口播稿
    description: 短视频出镜或配音台词
    icon: Microphone
    needsImage: false
  - id: poster
    label: 产品海报
    description: 根据素材整理卖点版式
    icon: Picture
    needsImage: true
  - id: grid
    label: 九宫格
    description: 一组可连续发布的图片内容
    icon: Grid
    needsImage: true
  - id: storyboard
    label: 短视频分镜
    description: 镜头、字幕和动作建议
    icon: VideoPlay
    needsImage: false
