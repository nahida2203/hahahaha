channels:
  - id: douyin
    name: 抖音
    icon: VideoPlay
    description: 年轻用户聚集，节奏快、互动强
    copyStyle: 口语化短句 + 钩子开场 + 话题标签，突出卖点与行动号召
  - id: shipinhao
    name: 视频号
    icon: VideoCameraFilled
    description: 微信生态熟人传播，点赞即社交推荐
    copyStyle: 真实故事化叙述 + 熟人背书，卖点克制，结尾引导互动
  - id: pengyouquan
    name: 朋友圈
    icon: ChatDotRound
    description: 私域信任圈，适合图文分享
    copyStyle: 第一人称体验 + 细节真实，氛围感强，结尾引导私信咨询

template_scenes:
  - 新品上市
  - 节日营销
  - 产地故事
  - 丰收节
  - 品牌故事

template_styles:
  - 清新自然
  - 大气正式
  - 年轻潮流
  - 质朴乡土

templates:
  - id: tpl-tea-launch
    title: 福鼎白茶新品上市
    description: 突出新茶上市、清新口感与首发氛围，适合快速建立新品认知。
    scene: 新品上市
    style: 清新自然
    channelIds: [douyin, shipinhao, pengyouquan]
    promptExample: 围绕福鼎白茶新品上市，写一组适合抖音和朋友圈发布的短文案：突出“当季新采、口感清甜、产地直发”，语气亲切自然，不含夸大功效的表述。
    coverUrl: /photos/tea-glass.webp
    coverAlt: 透明玻璃杯中的冷泡茶饮，新品上市模板预览
    featured: true

  - id: tpl-festival
    title: 闽味团圆节日礼
    description: 围绕节庆赠礼与团聚场景，用福建地方风味打动收礼人。
    scene: 节日营销
    style: 大气正式
    channelIds: [douyin, shipinhao, pengyouquan]
    promptExample: 结合春节、中秋等节庆团聚场景，为福建特色农产品礼盒生成赠礼文案：体现心意与家乡味，避免虚假稀缺和过度促销。
    coverUrl: /photos/tea-light.webp
    coverAlt: 茶园暖光与茶叶实拍，节日营销模板预览
    featured: true

  - id: tpl-origin-story
    title: 来自山野的味道
    description: 用产地环境、种植过程和人物故事建立真实可信的产品印象。
    scene: 产地故事
    style: 质朴乡土
    channelIds: [douyin, shipinhao]
    promptExample: 从产地环境、生产者与一项真实工序切入，生成有画面感但不夸大的产地故事文案，用于短视频口播与封面标题。
    coverUrl: /photos/green-plant.webp
    coverAlt: 茶园绿植与自然光影，产地故事模板预览
    featured: true

  - id: tpl-harvest
    title: 丰收季一起尝鲜
    description: 强化成熟时令、采收现场与限时尝鲜感，适合丰收节点传播。
    scene: 丰收节
    style: 年轻潮流
    channelIds: [douyin, shipinhao, pengyouquan]
    promptExample: 围绕采收现场、时令口感和产地直发，生成节奏明快的丰收节文案：含短视频开场、字幕要点和朋友圈分享语。
    coverUrl: /photos/tea-light.webp
    coverAlt: 茶园晨光中的茶叶实拍，丰收节模板预览
    featured: true

  - id: tpl-brand-story
    title: 闽味好物品牌故事
    description: 从品牌坚持、生产标准与长期价值出发，形成稳定可信的品牌表达。
    scene: 品牌故事
    style: 大气正式
    channelIds: [shipinhao, pengyouquan]
    promptExample: 提炼品牌起点、品质标准与对消费者的承诺，生成克制可信的品牌故事长文，以及用于视频号与朋友圈的摘要文案。
    coverUrl: /photos/tea-cup.webp
    coverAlt: 茶汤与茶杯产品实拍，品牌故事模板预览

  - id: tpl-real-origin
    title: 镜头里的真实产地
    description: 用实拍素材记录采摘、加工与发货过程，表达自然质朴。
    scene: 产地故事
    style: 质朴乡土
    channelIds: [douyin, shipinhao]
    promptExample: 按“环境、人物、工序、成品”顺序组织实拍素材，生成自然口吻的纪实短视频脚本与字幕文案。
    coverUrl: /photos/green-plant.webp
    coverAlt: 茶园植物细节实拍，真实产地模板预览

  - id: tpl-quality-detail
    title: 品质卖点一页说清
    description: 把核心卖点、规格与品质依据整理成清晰易读的商品内容。
    scene: 新品上市
    style: 大气正式
    channelIds: [shipinhao, pengyouquan]
    promptExample: 根据产品真实卖点与规格，生成一页式详情文案：结构清楚、信息克制，适合视频号图文与朋友圈长文。
    coverUrl: /photos/tea-glass.webp
    coverAlt: 冷泡茶饮产品细节实拍，品质详情模板预览

  - id: tpl-young-share
    title: 这一口福建味，有点上头
    description: 传统风味也可以很年轻，用轻快表达触达年轻受众。
    scene: 品牌故事
    style: 年轻潮流
    channelIds: [douyin, pengyouquan]
    promptExample: 保留产品真实特点，用轻快不浮夸的语气生成短视频开场、字幕和朋友圈分享文案。
    coverUrl: /photos/tea-cup.webp
    coverAlt: 茶汤和茶杯生活方式实拍，年轻化分享模板预览

