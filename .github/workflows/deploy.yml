name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write crypto key from secret (optional)
        # 若在仓库 Settings -> Secrets 中配置了 VITE_CRYPTO_KEY，
        # 则构建时写入 .env，使 Pages 上 AI 模型的加密配置可正常解密；
        # 未配置时构建照常成功，站点可浏览，仅真实 AI 调用不可用。
        run: |
          if [ -n "${{ secrets.VITE_CRYPTO_KEY }}" ]; then
            echo "VITE_CRYPTO_KEY=${{ secrets.VITE_CRYPTO_KEY }}" > .env
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
